<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RootPath labs: searchable list of TryHackMe and HackTheBox labs. Start and complete labs to earn XP.">
  <meta name="author" content="IMS566 Student, UiTM">
  <title>Labs | RootPath</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M9 23V9h8a4 4 0 0 1 0 8h-8m7 0 6 6' fill='none' stroke='%23f54c52' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-md rt-navbar" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand rt-brand" href="dashboard.html">Root<span>Path</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="labs.html">Labs</a></li>
          <li class="nav-item"><a class="nav-link" href="roadmap.html">Roadmap</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        </ul>
        <div id="accentPicker" class="d-flex gap-2 align-items-center me-3 my-2 my-md-0" aria-label="Theme colour"></div>
        <span class="navbar-text me-3">Hi, <strong id="navUser"></strong></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <header class="mb-4 d-flex flex-wrap justify-content-between align-items-end gap-2">
      <div>
        <h1 class="h3 mb-1">Labs &amp; CTF Rooms</h1>
        <p class="text-secondary mb-0">Click a lab to start it or mark it completed and earn XP.</p>
      </div>
      <button id="resetBtn" class="btn btn-sm btn-outline-secondary" type="button">Reset progress</button>
    </header>

    <section class="row g-2 mb-3" aria-label="Filters">
      <div class="col-12 col-md-6">
        <label for="searchInput" class="visually-hidden">Search labs</label>
        <input type="search" id="searchInput" class="form-control" placeholder="Search any column: lab, platform, category, difficulty, status, XP...">
      </div>
      <div class="col-6 col-md-3">
        <label for="statusFilter" class="visually-hidden">Filter by status</label>
        <select id="statusFilter" class="form-select">
          <option value="All">All statuses</option>
          <option>Completed</option>
          <option>In Progress</option>
          <option>Planned</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label for="platformFilter" class="visually-hidden">Filter by platform</label>
        <select id="platformFilter" class="form-select">
          <option value="All">All platforms</option>
          <option>TryHackMe</option>
          <option>HackTheBox</option>
        </select>
      </div>
    </section>

    <p class="small text-secondary font-mono" id="resultCount" aria-live="polite"></p>

    <div class="card rt-card reveal"><div class="card-body p-2 p-md-3">
      <div class="table-responsive">
        <table class="table table-hover align-middle rt-table mb-0">
          <thead>
            <tr>
              <th scope="col" class="sortable" data-sort="name" aria-sort="none" tabindex="0" role="columnheader">Lab<span class="sort-ind" aria-hidden="true"></span></th>
              <th scope="col" class="sortable" data-sort="platform" aria-sort="none" tabindex="0" role="columnheader">Platform<span class="sort-ind" aria-hidden="true"></span></th>
              <th scope="col" class="sortable" data-sort="category" aria-sort="none" tabindex="0" role="columnheader">Category<span class="sort-ind" aria-hidden="true"></span></th>
              <th scope="col" class="sortable" data-sort="difficulty" aria-sort="none" tabindex="0" role="columnheader">Difficulty<span class="sort-ind" aria-hidden="true"></span></th>
              <th scope="col" class="sortable" data-sort="status" aria-sort="none" tabindex="0" role="columnheader">Status<span class="sort-ind" aria-hidden="true"></span></th>
              <th scope="col" class="sortable text-end" data-sort="points" aria-sort="none" tabindex="0" role="columnheader">XP<span class="sort-ind" aria-hidden="true"></span></th>
            </tr>
          </thead>
          <tbody id="labsBody"></tbody>
        </table>
      </div>
    </div></div>
  </main>

  <!-- Lab detail modal -->
  <div class="modal fade" id="labModal" tabindex="-1" aria-labelledby="mTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rt-modal">
        <div class="modal-header border-0">
          <h2 class="modal-title h5" id="mTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="mBadges" class="mb-3"></div>
          <p id="mDesc"></p>
          <div class="row small text-secondary" id="mMeta"></div>
        </div>
        <div class="modal-footer border-0" id="mActions"></div>
      </div>
    </div>
  </div>

  <footer class="rt-footer py-3 mt-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>&copy; <span id="year"></span> RootPath</span>
      <span><a href="dashboard.html">Dashboard</a> &middot; <a href="labs.html">Labs</a> &middot; <a href="roadmap.html">Roadmap</a> &middot; <a href="about.html">About</a></span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/shader.js"></script>
  <script src="js/app.js"></script>
  <script src="js/labs.js"></script>
</body>
</html>
